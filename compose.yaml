services:
  jitd:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      JITD_PROFILE: enterprise
      JITD_DATA_DIR: /app/data
      JITD_ALLOWED_HOSTS: ${JITD_ALLOWED_HOSTS:-localhost,127.0.0.1}
      JITD_MAX_MODEL_CALLS: ${JITD_MAX_MODEL_CALLS:-0}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_MODEL_ID: ${NEBIUS_MODEL_ID:-}
      NEBIUS_BASE_URL: https://api.tokenfactory.nebius.com/v1/
    volumes:
      - jitd-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    stop_grace_period: 40s
volumes:
  jitd-data:
