name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --user -r requirements.lock
      - run: python -m pip check
      - run: python scripts/secret_scan.py
      - run: python -m pytest -q
      - run: python -m jitd.live --compiles 1 --plan
      - run: python -m pip install ruff pip-audit
      - run: python -m ruff check --select F821 jitd scripts
      - run: python -m pip_audit -r requirements.lock --progress-spinner off
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jitd-review .
